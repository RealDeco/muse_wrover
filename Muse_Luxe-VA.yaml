packages:
  extcomp:
    url: https://github.com/RealDeco/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/HW/sendspin-external_components_2026.10.0.yaml

esphome:
  name: muse-luxe
  friendly_name: Muse Luxe
  min_version: 2026.10.0
  name_add_mac_suffix: true
  project:
    name: realdeco.muse_wrover
    version: "2026.10.0"
  on_boot:
    priority: -100
    then:
      - micro_wake_word.disable_model: stop  # Enabled state is saved; never boot with it on
      - script.execute: refresh_timer_text
      - script.execute: led_red
      # Amp stays off until the codec is set up, otherwise it plays loud noise at boot
      - delay: 500ms
      - globals.set:
          id: amp_ready
          value: "true"
      - script.execute: apply_amp

esp32:
  variant: esp32
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_WIFI_RX_IRAM_OPT: "y" # Unnecessary on an ESP32-S3; uses more internal memory
      CONFIG_ESP_WIFI_IRAM_OPT: "y"  # Unnecessary on an ESP32-S3; uses more internal memory
      CONFIG_ESP_WIFI_EXTRA_IRAM_OPT: "y"  # Unnecessary on an ESP32-S3; uses more internal memory
      CONFIG_LWIP_IRAM_OPTIMIZATION: "y"  # Unnecessary on an ESP32-S3; uses more internal memory
    advanced:
      sram1_as_iram: true
      flash_chip: generic

logger:
  level: warn

api:
  on_client_connected:
    - delay: 2000ms
    - lambda: |-
        if (!id(boot_sound_played)) {
          id(boot_sound_played) = true;
          if (id(startup_sound_switch).state) {
            id(play_sound)->execute(true, std::string("timer_finished_sound"));
          }
        }

ota:
- platform: esphome

wifi:
  ap:

improv_serial:

psram:
  mode: quad
  speed: 80MHz

captive_portal:

i2c:
  sda: GPIO18
  scl: GPIO23
  frequency: 100kHz
  id: bus_a

# USING EXTERNAL COMPONENT (still works best)
external_components:
  - source: github://pr#3552
    components: [es8388]
    refresh: 0s
es8388:

# USING INTERNAL COMPONENT (leave it commented out)
#audio_dac:
#  - platform: es8388
#    id: es8388_dac

output:
  - platform: gpio
    pin: GPIO21  # Amp enable, high = on; starts low (off) at boot
    id: amp_enable

audio:
  codecs:
    flac:
      buffer_memory: internal  # Unnecessary on an ESP32-S3; uses more internal memory
    # No opus block: it forces the Opus decoder in, and the VA build does not fit 4MB flash with it

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false
  on_pairing_failed:
    - logger.log:
        format: "Sendspin pairing failed: %s"
        args: ["reason.c_str()"]
        level: WARN

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin:
      number: GPIO5
      ignore_strapping_warning: true
    full_duplex: true

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    sample_rate: 48000
    i2s_din_pin: GPIO35
    bits_per_sample: 16bit
    channel: stereo
    adc_type: external
  - platform: resampler
    id: voice_mic
    microphone:
      microphone: box_mic
      channels: [0]
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO26
    dac_type: external
    sample_rate: 48000
    channel: stereo
    buffer_duration: 300ms
    timeout: never

  - platform: mixer
    id: mixing_speaker
    output_speaker: box_speaker
    num_channels: 2
    task_stack_in_psram: false
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

audio_file:
  - id: timer_finished_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/timer_finished_48k.flac

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: sendspin_media_source
    decode_memory: internal
    static_delay_adjustable: true
    codecs: [flac, pcm]  # Opus left out to save flash

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player

  - platform: speaker_source
    id: external_media_player
    name: none

    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.1
    volume_max: 0.9

    on_announcement:
      - script.stop: mp_idle_debounce
      - mixer_speaker.apply_ducking:  # Lower music under announcements
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s

    on_play:
      - script.stop: mp_idle_debounce
      - script.execute: stop_wake_word  # No echo cancellation, so no wake word during music
      - script.execute: reset_led

    on_pause:
      - script.execute: reset_led
      - script.execute: start_wake_word

    on_idle:
      - script.execute: mp_idle_debounce

    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing:
                id: external_media_player
          then:
            - mixer_speaker.apply_ducking:  # Bring music back after announcements
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s

micro_wake_word:
  id: mww
  microphone: voice_mic
  stop_after_detection: false  # Keep listening during replies so "stop" can be heard
  models:
    - okay_nabu
    # Only enabled while a TTS reply plays or a timer rings
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
#    - hey_jarvis
#    - alexa
#    - hey_mycroft
#    - model: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/refs/heads/main/MicroWakeWords/models/v2/hey_sarah.json
#    - model: https://raw.githubusercontent.com/JohnnyPrimus/Custom_V2_MicroWakeWords/refs/heads/main/models/computer/computer.json
#    - model: https://raw.githubusercontent.com/JohnnyPrimus/Custom_V2_MicroWakeWords/refs/heads/main/models/hey_friday/hey_friday.json
#    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
#    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/refs/heads/main/microwakeword/models/v2/kenobi.json
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/choo_choo_homie.json
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/hey_home_assistant.json
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/hey_peppa_pig.json
#    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/refs/heads/main/models/v2/experiments/okay_computer.json

  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
        else:
          - if:
              condition:
                voice_assistant.is_running:
              then:
                - voice_assistant.stop:
              else:
                - if:
                    condition:
                      media_player.is_announcing:
                        id: external_media_player
                    then:
                      - media_player.stop:
                          announcement: true
                          id: external_media_player
                    else:
                      - voice_assistant.start:
                          wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: voice_mic
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: led
              blue: 100%
              red: 0%
              green: 0%
              effect: "Slow Pulse"
  on_stt_vad_end:
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: led
              blue: 100%
              red: 0%
              green: 0%
              effect: "Fast Pulse"
  on_tts_start:
    - script.execute: activate_stop_word_once
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: led
              blue: 100%
              red: 0%
              green: 0%
              brightness: 100%
              effect: none

  on_end:
    - wait_until:
        condition:
          media_player.is_announcing:
            id: external_media_player
        timeout: 0.5s
    - wait_until:
        not:
          media_player.is_announcing:
            id: external_media_player
    - if:
        condition:
          lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - script.execute: start_wake_word

  on_error:
    - if:
        condition:
          switch.is_off: mute
        then:
          - script.execute: start_wake_word
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 100%
              effect: none
    - delay: 2s
    - script.execute: reset_led

  on_client_connected:
    - script.execute: start_wake_word

  on_client_disconnected:
    - script.execute: stop_wake_word

  on_timer_started:
    - script.execute: refresh_timer_text
  on_timer_updated:
    - script.execute: refresh_timer_text
  on_timer_cancelled:
    - script.execute: refresh_timer_text
  on_timer_tick:
    - script.execute: refresh_timer_text
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - script.execute: refresh_timer_text
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: led
              red: 0%
              green: 100%
              blue: 0%
              brightness: 100%
              effect: "Fast Pulse"
    - wait_until:
        media_player.is_announcing:
          id: external_media_player
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: led
              blue: 0%
              red: 100%
              green: 0%
              effect: "Fast Pulse"

script:
  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            and:
              - media_player.is_idle: external_media_player
              - not:
                  voice_assistant.is_running:
          then:
            - script.execute: reset_led
            - script.execute: start_wake_word
  - id: reset_led
    then:
      - if:
          condition:
            - switch.is_on: use_listen_light
          then:
            - if:
                condition:
                  - switch.is_on: timer_ringing
                then:
                  - light.turn_on:
                      id: led
                      red: 100%
                      green: 0%
                      blue: 0%
                      brightness: 100%
                      effect: "Fast Pulse"
                else:
                  - if:
                      condition:
                        - media_player.is_playing: external_media_player
                      then:
                        - light.turn_on:
                            id: led
                            red: 0%
                            green: 100%
                            blue: 0%
                            effect: "Slow Pulse"
                      else:
                        - if:
                            condition:
                              - not:
                                  voice_assistant.is_running:
                            then:
                              - if:
                                  condition:
                                    - switch.is_on: mute
                                  then:
                                    - light.turn_on:
                                        id: led
                                        red: 100%
                                        green: 0%
                                        blue: 0%
                                        brightness: 100%
                                        effect: none
                                  else:
                                    - if:
                                        condition:
                                          - lambda: return id(wake_word_engine_location).current_option() == "On device";
                                        then:
                                          - light.turn_on:
                                              id: led
                                              red: 100%
                                              green: 89%
                                              blue: 71%
                                              brightness: 30%
                                              effect: none
                                        else:
                                          - light.turn_on:
                                              id: led
                                              red: 0%
                                              green: 100%
                                              blue: 100%
                                              brightness: 30%
                                              effect: none
          else:
            - light.turn_off: led
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  - voice_assistant.is_running:
              - not:
                  - micro_wake_word.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:
  - id: activate_stop_word_once
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
          timeout: 5s
      - delay: 1s  # Skip the start of the reply
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
      - wait_until:
          not:
            media_player.is_announcing:
              id: external_media_player
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.disable_model: stop
  - id: refresh_timer_text
    mode: restart
    then:
      - delay: 10ms  # on_timer_cancelled fires before the timer leaves the list
      - lambda: |-
          if (id(timer_ringing).state) {
            id(timer_countdown).publish_state("Ringing");
            return;
          }
          // Shortest running timer; fall back to a paused one
          const voice_assistant::Timer *best = nullptr;
          for (auto &t : id(va).get_timers()) {
            if (best == nullptr || (t.is_active && !best->is_active) ||
                (t.is_active == best->is_active && t.seconds_left < best->seconds_left)) {
              best = &t;
            }
          }
          if (best == nullptr) {
            id(timer_countdown).publish_state("Idle");
            return;
          }
          uint32_t s = best->seconds_left;
          char buf[24];
          if (s >= 3600) {
            snprintf(buf, sizeof(buf), "%u:%02u:%02u", (unsigned) (s / 3600), (unsigned) (s / 60 % 60), (unsigned) (s % 60));
          } else {
            snprintf(buf, sizeof(buf), "%u:%02u", (unsigned) (s / 60), (unsigned) (s % 60));
          }
          std::string text = buf;
          if (!best->is_active) text += " paused";
          id(timer_countdown).publish_state(text);
  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "timer_finished_sound"
  - id: enable_repeat_one
    then:
      - media_player.repeat_one:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms
  - id: disable_repeat
    then:
      - media_player.repeat_off:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 0ms
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
  - id: apply_amp
    then:
      - if:
          condition:
            lambda: return id(amp_ready) && !id(mute_speaker).state;
          then:
            - output.turn_on: amp_enable
          else:
            - output.turn_off: amp_enable
  - id: led_red
    then:
      - light.turn_on:
          id: led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

switch:
  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: Use listen light
    id: use_listen_light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: reset_led
    on_turn_off:
      - script.execute: reset_led
  - platform: template
    name: Mute microphone
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute: box_mic
      - script.execute: start_wake_word
      - script.execute: reset_led
    on_turn_on:
      - script.execute: stop_wake_word
      - microphone.mute: box_mic
      - script.execute: reset_led
  - platform: template
    name: Mute speaker
    id: mute_speaker
    icon: "mdi:volume-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - script.execute: apply_amp
    on_turn_on:
      - script.execute: apply_amp
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - script.execute: disable_repeat
      - script.execute: refresh_timer_text
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            media_player.stop:
              announcement: true
              id: external_media_player
      - wait_until:
          condition:
            not:
              media_player.is_announcing:
                id: external_media_player
          timeout: 1s
      - delay: 100ms
      - script.execute: reset_led
    on_turn_on:
      - micro_wake_word.enable_model: stop
      - script.execute: ring_timer
      - delay: 15min
      - switch.turn_off: timer_ringing
  - platform: sendspin
    id: sendspin_unpaired_access
    type: unpaired_access
    name: "Sendspin Unpaired Access"
    restore_mode: RESTORE_DEFAULT_ON

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"

  - platform: template
    id: sendspin_confirm_pairing
    name: "Sendspin Confirm Pairing"
    icon: mdi:link-variant
    entity_category: config
    on_press:
      - sendspin.confirm_pairing_window: sendspin_hub

text_sensor:
  - platform: template
    id: timer_countdown
    name: "Timer"
    icon: "mdi:timer-outline"
    update_interval: never

  - platform: sendspin
    id: sendspin_title
    name: "Song Title"
    type: title

  - platform: sendspin
    id: sendspin_artist
    name: "Song Artist"
    type: artist

  - platform: sendspin
    id: sendspin_album
    name: "Album Name"
    type: album

  - platform: sendspin
    id: sendspin_pairing_code
    type: pairing_code
    name: "Sendspin Pairing Code"

select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - script.execute: stop_wake_word
      - delay: 500ms
      - if:
          condition:
            switch.is_off: mute
          then:
            - script.execute: start_wake_word

globals:
  - id: boot_sound_played
    type: bool
    restore_value: no
    initial_value: "false"
  - id: amp_ready
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    name: Button
    on_multi_click:
      # Hold = switch to the next active Sendspin group
      - timing:
          - ON for at least 1s
        then:
          - sendspin.switch:

      # Triple click
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 200ms
        then:
          - media_player.previous: sendspin_group_media_player

      # Double click
      - timing:
          - ON for at most 500ms
          - OFF for at most 400ms
          - ON for at most 500ms
          - OFF for at least 200ms
        then:
          - media_player.next: sendspin_group_media_player

      # Single click
      - timing:
          - ON for at most 500ms
          - OFF for at least 500ms
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - voice_assistant.stop:
                      - wait_until:
                          condition:
                            not:
                              voice_assistant.is_running:
                          timeout: 2s
                      - script.execute: reset_led
                      - script.execute: start_wake_word
                    else:
                      - media_player.toggle: sendspin_group_media_player

  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Up
    on_click:
      - media_player.volume_up:
          id: external_media_player

  - platform: gpio
    pin:
      number: GPIO32
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Down
    on_click:
      - media_player.volume_down:
          id: external_media_player

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: LED light
    disabled_by_default: false
    entity_category: config
    pin: GPIO22
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    channel_colors: GRB
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

sensor:
  - platform: adc
    pin: GPIO33
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 10s
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
      - multiply: 1.90
      - throttle: 1min
    on_value:
      then:
        - sensor.template.publish:
            id: battery_percentage
            state: !lambda 'return x;'

  - platform: template
    id: battery_percentage
    name: "Battery Percentage"
    update_interval: never
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:battery-medium
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 2.80 -> 0.0
            - 3.10 -> 10.0
            - 3.30 -> 20.0
            - 3.45 -> 30.0
            - 3.60 -> 40.0
            - 3.70 -> 50.0
            - 3.75 -> 60.0
            - 3.80 -> 70.0
            - 3.90 -> 80.0
            - 4.00 -> 90.0
            - 4.20 -> 100.0
      - lambda: |-
          if (x > 100) return 100;
          if (x < 0) return 0;
          return x;
